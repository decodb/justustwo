<main class="signin">
  <a class="back" routerLink="">&lt; /home</a>

  <section
    class="term"
    [class.term--error]="status() === 'error'"
    [class.term--ok]="status() === 'success'"
  >
    <header class="term__bar">
      <span class="dot dot--pink"></span>
      <span class="dot dot--yellow"></span>
      <span class="dot dot--mint"></span>
      <span class="term__title">access_terminal</span>
    </header>

    <div class="term__body">
      <svg class="lock" viewBox="0 0 24 24" aria-hidden="true">
        <path class="lock__shackle" d="M8 11V8a4 4 0 0 1 8 0v3" />
        <rect class="lock__body" x="5" y="11" width="14" height="10" rx="2.5" />
        <circle cx="12" cy="16" r="1.3" fill="#121117" />
      </svg>

      <h1>restricted area</h1>
      <p class="hint">only one person has the key 💗</p>

      @if (status() !== 'success') {
        <form class="form" (ngSubmit)="submit()" novalidate>
          <label for="code">&gt; enter_access_code</label>

          <div class="field" [class.field--shake]="shaking()" (animationend)="shaking.set(false)">
            <input
              id="code"
              name="code"
              type="text"
              [(ngModel)]="code"
              (input)="onInput()"
              [attr.aria-invalid]="status() === 'error'"
              placeholder="••••••••"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
            />
          </div>

          <p class="msg" role="alert">{{ status() === 'error' ? message() : '' }}</p>

          <button class="btn" type="submit" [disabled]="status() === 'checking'">
            {{ status() === 'checking' ? 'checking...' : 'unlock →' }}
          </button>
        </form>
      } @else {
        <div class="granted" role="status">
          <p class="granted__title">ACCESS GRANTED</p>
          <div class="bar"><span class="bar__fill" [style.animation-duration.ms]="unlockMs"></span></div>
          <small>unlocking our file<span class="dots"></span></small>
        </div>
      }
    </div>
  </section>
</main>
